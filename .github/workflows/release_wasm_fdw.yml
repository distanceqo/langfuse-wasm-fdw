name: Release


on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Push events to matching wasm fdw tag, i.e. v1.0.2

permissions:
  contents: write

jobs:
  release:
    name: Create Wasm FDW Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          # Stable, not a pinned version: cargo-component's dependency tree now needs
          # edition2024, which 1.81.0 cannot parse.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal && \
            rustup --version && \
            rustc --version && \
            cargo --version

          # add wasm32-unknown-unknown target
          rustup target add wasm32-unknown-unknown

          # wit-bindgen shells out to rustfmt when generating bindings
          rustup component add rustfmt

          # install Wasm component — must match CARGO_COMPONENT_VERSION in ci.yml
          cargo install cargo-component --locked --version 0.21.1

          # show all installed packagies
          cargo install --list

      - name: Build Wasm FDW
        run: |
          cargo component build --release --target wasm32-unknown-unknown

      - name: Calculate Wasm file checksum
        uses: jmgilman/actions-generate-checksum@v1
        with:
          method: sha256
          output: checksum.txt
          patterns: |
            ./target/wasm32-unknown-unknown/release/*.wasm

      - name: Get project metadata JSON
        id: metadata
        run: |
          METADATA_JSON=`cargo metadata --format-version 1 --no-deps --offline`
          echo "METADATA_JSON=$METADATA_JSON" >> "$GITHUB_OUTPUT"

      - name: Extract package info
        id: extract
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROJECT="${{ fromJson(steps.metadata.outputs.METADATA_JSON).packages[0].name }}"
          PACKAGE="${{ fromJson(steps.metadata.outputs.METADATA_JSON).packages[0].metadata.component.package }}"
          VERSION=`echo "${TAG}" | sed -E 's/v(.*)/\1/'`
          CHECKSUM=`head -1 checksum.txt | sed -E 's/^(.*) .*/\1/'`
          echo "PROJECT=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create README.txt
        env:
          PROJECT: ${{ steps.extract.outputs.PROJECT }}
          PACKAGE: ${{ steps.extract.outputs.PACKAGE }}
          VERSION: ${{ steps.extract.outputs.VERSION }}
          CHECKSUM: ${{ steps.extract.outputs.CHECKSUM }}
        run: |
          cat > README.txt <<EOF
          To use this Wasm foreign data wrapper on Supabase, create a foreign table like below,

          create extension if not exists wrappers with schema extensions;

          create foreign data wrapper wasm_wrapper
            handler wasm_fdw_handler
            validator wasm_fdw_validator;

          -- store the API keys in Vault so they stay out of DDL and pg_dump
          select vault.create_secret('pk-lf-...', 'langfuse_public_key');
          select vault.create_secret('sk-lf-...', 'langfuse_secret_key');

          create server langfuse_server
            foreign data wrapper wasm_wrapper
            options (
              fdw_package_url 'https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${PROJECT}.wasm',
              fdw_package_name '${PACKAGE}',
              fdw_package_version '${VERSION}',
              fdw_package_checksum '${CHECKSUM}',
              -- jp / us / eu; must match the region the project was created in
              api_url 'https://cloud.langfuse.com',
              public_key_name 'langfuse_public_key',
              secret_key_name 'langfuse_secret_key'
            );

          create schema langfuse;

          -- creates both the traces and observations foreign tables
          import foreign schema langfuse from server langfuse_server into langfuse;

          For more details, please visit https://fdw.dev.
          EOF

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            README.txt
            checksum.txt
            ./target/wasm32-unknown-unknown/release/*.wasm

