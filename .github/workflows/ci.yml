name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Kept in sync with release_wasm_fdw.yml so CI exercises the same toolchain the
  # release uses — building 0.2.0 with 0.21.1 instead produced different bytes.
  #
  # Note this does not make builds reproducible: the checksum below still drifts
  # between runs as the stable toolchain and dependency patch versions move. The
  # authoritative checksum is the one published with each release, computed from
  # the exact artifact users download.
  CARGO_COMPONENT_VERSION: 0.13.2

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          # Stable rather than a pinned version — pinning is what broke the release
          # job once already, when cargo-component's dependency tree started
          # requiring edition2024.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          rustup target add wasm32-unknown-unknown
          # wit-bindgen shells out to rustfmt when generating bindings
          rustup component add rustfmt clippy
          rustc --version && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ env.CARGO_COMPONENT_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.CARGO_COMPONENT_VERSION }}-

      - name: Install cargo-component
        run: |
          if [ "$(cargo component --version 2>/dev/null | awk '{print $2}')" = "$CARGO_COMPONENT_VERSION" ]; then
            echo "cargo-component $CARGO_COMPONENT_VERSION already cached"
          else
            cargo install cargo-component --locked --version "$CARGO_COMPONENT_VERSION"
          fi

          # cargo-component 0.13.2 asks for wasm32-wasi, renamed to wasm32-wasip1 in
          # newer toolchains. Install the real target and alias the old name.
          rustup target add wasm32-wasip1
          RUSTLIB="$(rustc --print sysroot)/lib/rustlib"
          if [ -d "$RUSTLIB/wasm32-wasip1" ] && [ ! -e "$RUSTLIB/wasm32-wasi" ]; then
            ln -s "$RUSTLIB/wasm32-wasip1" "$RUSTLIB/wasm32-wasi"
          fi

      - name: Build Wasm component
        run: cargo component build --release --target wasm32-unknown-unknown

      - name: Check formatting
        # Only our source: src/bindings.rs is generated by wit-bindgen and gitignored,
        # and `cargo fmt` has no stable way to exclude it. Runs after the build because
        # rustfmt resolves `mod bindings` and the file does not exist until then.
        run: rustfmt --check --edition 2021 src/lib.rs

      - name: Clippy
        # Lints the same target the component is built for, so cfg(target_arch)
        # differences cannot hide a warning until release time.
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings

      - name: Report artifact
        run: |
          WASM=target/wasm32-unknown-unknown/release/langfuse_fdw.wasm
          test -f "$WASM" || { echo "component was not produced"; exit 1; }
          echo "size: $(stat -c%s "$WASM") bytes"
          echo "sha256: $(sha256sum "$WASM" | cut -d' ' -f1)"

      - name: Check the version table is current
        # A release publishes a URL and checksum into the docs; a stale version there
        # sends users to a package that does not match what they are told to expect.
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "Cargo.toml version: $VERSION"
          for f in README.md scripts/install.sql; do
            if ! grep -q "fdw_package_version '$VERSION'" "$f"; then
              echo "::error file=$f::fdw_package_version does not match Cargo.toml ($VERSION)"
              exit 1
            fi
            if ! grep -q "releases/download/v$VERSION/" "$f"; then
              echo "::error file=$f::fdw_package_url does not point at v$VERSION"
              exit 1
            fi
          done
          echo "version references are consistent"
